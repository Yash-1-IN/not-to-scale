<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not to Scale</title>
  <script>document.documentElement.className = "js";</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500&family=Nunito:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="frame" aria-hidden="true"></div>

  <button class="mute" id="mute" type="button" aria-pressed="false">Sound: on</button>

  <div class="topbar" id="topbar" hidden>
    <button class="mute" id="contentsBtn" type="button">Contents</button>
    <span class="counter" id="counter" aria-label="Page number"></span>
  </div>

  <!-- Cover: the first tap unlocks audio -->
  <div class="cover" id="cover">
    <h1 class="cover-title">Not to Scale</h1>
    <p class="cover-sub">A picture book of IB Chemistry. Simple on purpose.</p>
    <button class="open-btn" id="openBook" type="button">Open the book</button>
  </div>

  <main class="page" id="page" inert>
    <h1 class="title fade" id="title">Not to Scale</h1>

    <div class="rule" aria-hidden="true">
      <span class="cap cap-left"></span>
      <span class="line"></span>
      <span class="cap cap-right"></span>
    </div>

    <!-- Two stacked caption layers; the engine crossfades between them -->
    <div class="captions" id="captions" aria-live="polite">
      <div class="caption" id="capA"></div>
      <div class="caption" id="capB"></div>
    </div>

    <!-- The engine draws each page's picture into #pageRoot -->
    <svg class="scene" id="scene" viewBox="0 0 1000 480" role="img" aria-labelledby="sceneTitle sceneDesc">
      <title id="sceneTitle"></title>
      <desc id="sceneDesc"></desc>
      <g id="pageRoot"></g>
    </svg>

    <p class="legend fade" id="legend" hidden></p>
  </main>

  <nav class="nav" id="nav" aria-label="Pages">
    <button class="nav-btn" id="backBtn" type="button" hidden>&larr; Back</button>
    <button class="nav-btn" id="replayBtn" type="button" hidden>&#8634; Replay</button>
    <button class="nav-btn" id="nextBtn" type="button" hidden>Next &rarr;</button>
  </nav>

  <!-- Contents page -->
  <section class="contents" id="contents" hidden aria-label="Contents">
    <div class="contents-inner">
      <h2>Contents</h2>
      <div id="tocBody"></div>
    </div>
  </section>

  <button class="lab-link" id="labLink" type="button">sound lab</button>
  <section class="lab" id="lab" hidden aria-label="Sound lab">
    <h2>Sound lab</h2>
    <div id="labBody"></div>
    <p class="lab-note">Tune by ear, then send me the numbers below.</p>
    <textarea id="labOut" readonly rows="6" aria-label="Current sound numbers"></textarea>
    <button class="nav-btn" id="labClose" type="button">Close</button>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/lab.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/engine.js"></script>

  <!-- Pages, in book order. To add a page, add one line here (see pages/_template.js). -->
  <script src="pages/00-planned.js"></script>
  <script src="pages/01-hydrogen.js"></script>
  <script src="pages/02-isotopes.js"></script>
  <script src="pages/03-shells.js"></script>
  <script src="pages/04-ionic.js"></script>

  <script>Book.boot();</script>
</body>
</html>
